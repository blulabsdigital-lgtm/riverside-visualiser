<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Riverside Bathroom Visualiser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>body{margin:0;background:#FFFFFF;font-family:"Plus Jakarta Sans",system-ui,sans-serif}</style></head><body>
<style>.rvz{font-family:inherit;color:#626D7A;max-width:1120px;margin:0 auto;padding:56px 20px;box-sizing:border-box}.rvz-head{text-align:center;max-width:660px;margin:0 auto 28px}.rvz-head h2{font-size:clamp(28px,4.4vw,42px);line-height:1.1;font-weight:700;color:#322F31;margin:0 0 12px}.rvz-head p{margin:0;font-size:17px;line-height:1.55}.rvz-eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C2501F;margin-bottom:12px}#rvz-mount{min-height:520px}</style>
<section class="rvz" id="rvz" aria-labelledby="rvz-title">
  <div class="rvz-head">
    <span class="rvz-eyebrow">Bathroom visualiser</span>
    <h2 id="rvz-title">See your new bathroom before we start</h2>
    <p>Answer two quick questions, add a photo of your bathroom, and see two premium designs for your own room.</p>
  </div>
  <div id="rvz-mount"></div>
</section>
<script src="visualiser.js?v=2" defer></script>
</body></html>
