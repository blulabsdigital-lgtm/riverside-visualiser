<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Riverside Bathroom Visualiser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>body{margin:0;background:#111112;font-family:"Plus Jakarta Sans",system-ui,sans-serif}</style></head><body>
<style>:where(.rvz){font-family:inherit;color:#C9C4BC;background:#1D1D1E;border-radius:28px;max-width:1120px;margin:0 auto;padding:56px 20px;box-sizing:border-box}:where(.rvz-logo){display:block;width:min(300px,72%);height:auto;margin:0 auto 18px;filter:url(#rvz-gold)}:where(.rvz-head){text-align:center;max-width:660px;margin:0 auto 28px}:where(.rvz-head h2){font-size:clamp(28px,4.4vw,42px);line-height:1.1;font-weight:700;color:#FFFFFF;margin:0 0 12px}:where(.rvz-head p){margin:0;font-size:17px;line-height:1.55}:where(.rvz-eyebrow){display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#D4AC5A;margin-bottom:12px}#rvz-mount{min-height:520px}</style>
<section class="rvz" id="rvz" aria-labelledby="rvz-title">
  <div class="rvz-head">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="rvz-gold" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.9178 0.0172 0.0653 0 0 0.4049 0.9154 -0.3217 0 0 0.2699 -0.0564 0.7855 0 0 0 0 0 1 0"/></filter></svg>
    <img class="rvz-logo" src="https://cdn.prod.website-files.com/687f8bc8806320c2296ac1e3/69392eaa85728d65fac25e5e_master-new.png" width="1549" height="855" alt="Riverside Construction Group" loading="lazy" decoding="async">
    <span class="rvz-eyebrow">Bathroom visualiser</span>
    <h2 id="rvz-title">See your new bathroom before we start</h2>
    <p>Pick your bathroom, add a photo, and see two premium designs for your own room in under a minute.</p>
  </div>
  <div id="rvz-mount"></div>
</section>
<script src="visualiser.js?v=7" defer></script>
</body></html>
